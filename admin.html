<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - E-commerce</title>
    <!-- Social Preview Meta Tags -->
    <meta property="og:title" content="THIAflow Admin">
    <meta property="og:description" content="Panel d'administration THIAflow.">
    <meta property="og:image" content="https://thiaflow-a8c10.web.app/preview.jpg">
    <meta property="og:url" content="https://thiaflow-a8c10.web.app/admin.html">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="THIAflow Admin">
    <meta name="twitter:description" content="Panel d'administration THIAflow.">
    <meta name="twitter:image" content="https://thiaflow-a8c10.web.app/preview.jpg">
    <!-- Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Cloudinary Upload Widget Script -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        /* CSS reset & variables */
        :root {
            --primary: #5E17EB;
            /* Violet */
            --secondary: #FF0D8D;
            /* Magenta */
            --bg-dark: #121212;
            --bg-panel: #1E1E1E;
            --bg-surface: #252525;
            --glass-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-light: #F5F5F5;
            --text-muted: #A0A0A0;
            --border-color: #333;
            --danger: #FF3B30;
            --success: #34C759;
            --warning: #FF9F0A;
            --font-family: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout & Utility */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(94, 23, 235, 0.4);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text-light);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(94, 23, 235, 0.2);
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* Dashboard Layout */
        #dashboard {
            padding-top: 100px;
            /* space for sticky header */
        }

        /* Header Sticky Glassmorphism */
        .header-sticky {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .desktop-actions {
            display: flex;
            gap: 10px;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-card.stat-rupture .value {
            color: var(--danger);
        }

        .stat-card.stat-promo .value {
            color: var(--secondary);
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Drawer Overlay & Panel */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .drawer-overlay.active {
            display: block;
            opacity: 1;
        }

        .drawer-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--bg-panel);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.5);
            z-index: 1001;
            transition: right 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .drawer-panel.open {
            right: 0;
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .drawer-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* Category Pills */
        .category-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-pill {
            flex: 1;
            min-width: 70px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .cat-pill:hover {
            border-color: var(--primary);
            color: var(--text-light);
        }

        .cat-pill.selected {
            background: var(--primary);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px rgba(94, 23, 235, 0.3);
        }

        /* Admin Tabs */
        .admin-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .admin-tab {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-tab:hover {
            border-color: var(--primary);
            color: var(--text-light);
        }

        .admin-tab.active {
            background: var(--primary);
            border-color: transparent;
            color: #fff;
        }

        /* Prod Row Enhancements */
        .prod-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            margin-bottom: 10px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .prod-row:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .prod-row-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: #222;
        }

        .prod-row-info {
            flex: 1;
            min-width: 0;
        }

        .prod-row-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prod-row-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .prod-row-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
            text-align: right;
        }

        .prod-row-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
        }

        .row-badge.promo {
            background: var(--secondary);
        }

        .row-badge.new {
            background: var(--primary);
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .stock-badge.ok {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
            border: 1px solid rgba(52, 199, 89, 0.35);
        }

        .stock-badge.low {
            background: rgba(255, 159, 10, 0.15);
            color: var(--warning);
            border: 1px solid rgba(255, 159, 10, 0.35);
        }

        .stock-badge.rupture {
            background: rgba(255, 59, 48, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 59, 48, 0.35);
        }

        .stock-stepper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stock-stepper button {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .stock-stepper button:hover {
            border-color: var(--primary);
            background: rgba(94, 23, 235, 0.2);
        }

        .stock-stepper button.minus:hover {
            border-color: var(--danger);
            background: rgba(255, 59, 48, 0.2);
        }

        .stock-val {
            min-width: 25px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        #stock-alert-banner {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--danger);
            animation: pulse-border 2s infinite;
        }

        #stock-alert-banner.visible {
            display: flex;
        }

        #stock-alert-banner .alert-link {
            margin-left: auto;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
            color: var(--danger);
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input:checked+.slider:before {
            transform: translateX(22px);
            background-color: white;
        }

        .empty-admin {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        #image-preview {
            width: 100%;
            height: 180px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            overflow: hidden;
            background: var(--bg-dark);
            color: var(--text-muted);
        }

        #image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ════════════════════
           RESPONSIVE MOBILE
        ════════════════════ */
        .bottom-nav-admin {
            display: none;
        }

        @media (max-width: 767px) {
            #dashboard {
                padding-top: 80px;
                padding-bottom: 80px;
            }

            .header-sticky {
                height: 60px;
            }

            .header-brand {
                font-size: 1.2rem;
            }

            .desktop-actions {
                display: none !important;
            }

            .stats-bar {
                gap: 10px;
                margin-bottom: 15px;
            }

            .stat-card {
                padding: 10px;
            }

            .stat-card .value {
                font-size: 1.5rem;
            }

            .stat-card .label {
                font-size: 0.65rem;
            }

            .admin-tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                padding-bottom: 5px;
                scrollbar-width: none;
            }

            .admin-tabs::-webkit-scrollbar {
                display: none;
            }

            .admin-tab {
                white-space: nowrap;
                font-size: 0.8rem;
                padding: 6px 12px;
            }

            .prod-row {
                padding: 10px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .prod-row-thumb {
                width: 50px;
                height: 50px;
            }

            .prod-row-info {
                width: calc(100% - 70px);
            }

            .prod-row-name {
                font-size: 0.9rem;
            }

            .prod-row-meta {
                font-size: 0.75rem;
                gap: 6px;
            }

            .prod-row-price {
                width: 100%;
                text-align: left;
                font-size: 1rem;
                order: 3;
            }

            .stock-stepper {
                order: 4;
            }

            .prod-row-actions {
                order: 5;
                margin-left: auto;
                gap: 5px;
            }

            .prod-row-actions .btn {
                padding: 8px 12px;
                font-size: 0.9rem;
            }

            .toggle-switch {
                transform: scale(0.85);
                margin-right: -5px;
            }

            #admin-search {
                max-width: 100% !important;
                width: 100%;
            }

            /* Bottom Nav Admin */
            .bottom-nav-admin {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 65px;
                background: var(--glass-bg);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border-top: 1px solid var(--glass-border);
                justify-content: space-around;
                align-items: center;
                z-index: 100;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .b-nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                color: var(--text-muted);
                text-decoration: none;
                font-size: 0.7rem;
                font-weight: 500;
                cursor: pointer;
            }

            .b-nav-item.active {
                color: var(--primary);
            }

            .b-nav-icon {
                font-size: 1.2rem;
            }

            .b-nav-fab {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                width: 50px;
                height: 50px;
                border-radius: 25px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 1.5rem;
                margin-top: -25px;
                box-shadow: 0 4px 15px rgba(94, 23, 235, 0.4);
                border: none;
                cursor: pointer;
            }

            /* Drawer Mobile */
            .drawer-panel {
                right: 0;
                top: 100%;
                height: 90vh;
                max-width: 100%;
                border-radius: 20px 20px 0 0;
                transition: top 0.3s ease-in-out;
            }

            .drawer-panel.open {
                top: 10vh;
            }
        }

        /* Login */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background-color: var(--bg-panel);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            background: #fff;
            color: #3c4043;
            border: 1px solid #dadce0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
    </style>
</head>

<body>

    <!-- Ecran de connexion -->
    <div id="login-screen">
        <div class="login-box">
            <h2 class="text-gradient">Admin Login</h2>
            <button id="google-login-btn" type="button" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335"
                        d="M24 9.5c3.1 0 5.8 1.1 8 2.9l5.9-5.9C34.5 3.5 29.6 1.5 24 1.5 14.8 1.5 7 7.3 3.7 15.2l6.9 5.4C12.3 14.2 17.6 9.5 24 9.5z" />
                    <path fill="#4285F4"
                        d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.3-4 6.8-9.9 6.8-17z" />
                    <path fill="#FBBC05"
                        d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-6.9-5.4A22.5 22.5 0 0 0 1.5 24c0 3.6.9 7 2.4 10l6.7-5.4z" />
                    <path fill="#34A853"
                        d="M24 46.5c5.5 0 10.2-1.8 13.6-4.9l-7.4-5.8c-1.8 1.2-4.1 2-6.2 2-6.4 0-11.7-4.7-13.4-11l-6.7 5.4C7 40.7 14.8 46.5 24 46.5z" />
                </svg>
                Se connecter avec Google
            </button>
            <div class="login-divider"><span>ou</span></div>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="admin@boutique.com" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <p id="login-error"
                    style="color: var(--danger); font-size: 0.85rem; display: none; margin-bottom: 10px;"></p>
                <button type="submit" class="btn" style="width: 100%;">Se connecter</button>
            </form>
        </div>
    </div>

    <!-- Header Sticky (Desktop & Mobile) -->
    <header id="admin-header" class="header-sticky hidden">
        <div class="header-brand">
            <img src="logo.png" alt="THIAflow" style="height: 32px;">
            <span class="text-gradient">THIAflow Admin</span>
        </div>
        <div class="desktop-actions">
            <button class="btn" onclick="openDrawer()">&#43; Ajouter Produit</button>
            <a href="index.html" class="btn btn-outline">🏠 Accueil</a>
            <button id="logout-btn" class="btn btn-outline">Déconnexion</button>
        </div>
    </header>

    <!-- Dashboard Principal -->
    <div id="dashboard" class="hidden container">

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="value" id="stat-total">0</div>
                <div class="label">Produits</div>
            </div>
            <div class="stat-card stat-rupture" onclick="filterByRupture()" style="cursor:pointer;">
                <div class="value" id="stat-rupture">0</div>
                <div class="label">Ruptures</div>
            </div>
            <div class="stat-card stat-promo">
                <div class="value" id="stat-promo">0</div>
                <div class="label">Promotions</div>
            </div>
        </div>

        <!-- Alerte rupture -->
        <div id="stock-alert-banner">
            <span>🔴</span>
            <span><strong id="stock-alert-count">0</strong> produit(s) en rupture de stock !</span>
            <button class="alert-link" onclick="filterByRupture()">Voir →</button>
        </div>

        <div
            style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:15px; flex-wrap:wrap;">
            <div class="admin-tabs" id="admin-tabs" style="margin-bottom:0; flex:1;">
                <button class="admin-tab active" data-cat="" onclick="setAdminTab(this)">Tous</button>
                <button class="admin-tab" data-cat="Hygiène" onclick="setAdminTab(this)">🪶 Hygiène</button>
                <button class="admin-tab" data-cat="Soins" onclick="setAdminTab(this)">✨ Soins</button>
                <button class="admin-tab" data-cat="Parfums" onclick="setAdminTab(this)">🌸 Parfums</button>
                <button class="admin-tab" data-cat="__rupture__" id="tab-rupture" onclick="setAdminTab(this)">🔴
                    Rupture</button>
            </div>
            <input type="text" id="admin-search" class="form-control" placeholder="🔍 Rechercher..."
                style="max-width:250px; padding:10px 15px;" oninput="filterAdminList()">
        </div>

        <div id="product-list">
            <!-- Injecté via JS -->
        </div>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <nav id="bottom-nav-admin" class="bottom-nav-admin hidden">
        <a href="index.html" class="b-nav-item">
            <span class="b-nav-icon">🏠</span>
            <span>Store</span>
        </a>
        <div class="b-nav-item active" onclick="setAdminTab(document.querySelector('.admin-tab[data-cat=\'\']'))">
            <span class="b-nav-icon">📦</span>
            <span>Produits</span>
        </div>
        <button class="b-nav-fab" onclick="openDrawer()">&#43;</button>
        <div class="b-nav-item" onclick="filterByRupture()">
            <span class="b-nav-icon">🔴</span>
            <span>Ruptures</span>
        </div>
        <div class="b-nav-item" id="logout-btn-mobile">
            <span class="b-nav-icon">🚪</span>
            <span>Quitter</span>
        </div>
    </nav>

    <!-- Drawer Formulaire -->
    <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
    <div class="drawer-panel" id="drawer-panel">
        <div class="drawer-header">
            <h3 class="text-gradient" id="form-panel-title" style="margin:0; font-size:1.2rem;">Ajouter un Produit</h3>
            <button class="btn-outline" style="border:none; padding:5px 10px;" onclick="closeDrawer()">✕</button>
        </div>
        <div class="drawer-body">
            <form id="add-product-form">
                <div id="image-preview"><span>Aucune image</span></div>
                <button type="button" id="upload-widget-btn" class="btn btn-outline"
                    style="width:100%; margin-bottom:20px;">
                    Upload Image (Cloudinary)
                </button>
                <input type="hidden" id="prod-img-url">
                <input type="hidden" id="prod-cloud-id">

                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" id="prod-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <div class="category-pills" id="category-pills">
                        <button type="button" class="cat-pill" data-value="Hygiène">🧴 Hygiène</button>
                        <button type="button" class="cat-pill" data-value="Soins">✨ Soins</button>
                        <button type="button" class="cat-pill" data-value="Parfums">🌸 Parfums</button>
                    </div>
                    <input type="hidden" id="prod-cat" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" class="form-control" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Prix (F CFA)</label>
                    <input type="number" step="1" id="prod-price" class="form-control" required>
                </div>
                <div class="form-group" style="display:flex; gap:15px;">
                    <div style="flex:1;">
                        <label>Badge</label>
                        <select id="prod-badge" class="form-control">
                            <option value="">Aucun</option>
                            <option value="NEW">NEW</option>
                            <option value="PROMO">PROMO</option>
                        </select>
                    </div>
                    <div style="flex:1;">
                        <label>Stock</label>
                        <input type="number" id="prod-stock" class="form-control" value="10" required>
                    </div>
                </div>
                <button type="submit" id="form-submit-btn" class="btn" style="width:100%; margin-top:10px;">Ajouter le
                    Produit</button>
                <button type="button" id="cancel-edit-btn" class="btn btn-outline hidden" style="width:100%; margin-top:10px;" onclick="cancelEdit()">Annuler la modification</button>
            </form>
        </div>
    </div>

    <!-- Firebase & Logique JS -->
    <script type="module">
        // Import des modules Firebase v10
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, getDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        import { ENV } from './env.js';

        // ==========================================
        // 1. CONFIGURATION (DANS ENV.JS)
        // ==========================================
        const firebaseConfig = {
            apiKey: ENV.FIREBASE_API_KEY,
            authDomain: ENV.FIREBASE_AUTH_DOMAIN,
            projectId: ENV.FIREBASE_PROJECT_ID,
            storageBucket: ENV.FIREBASE_STORAGE_BUCKET,
            messagingSenderId: ENV.FIREBASE_MESSAGING_SENDER_ID,
            appId: ENV.FIREBASE_APP_ID,
            measurementId: ENV.FIREBASE_MEASUREMENT_ID
        };

        const CLOUDINARY_CLOUD_NAME = ENV.CLOUDINARY_CLOUD_NAME;
        const CLOUDINARY_UPLOAD_PRESET = ENV.CLOUDINARY_UPLOAD_PRESET;
        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const produitsCol = collection(db, "produits");

        // ==========================================
        // 2. AUTHENTIFICATION
        // ==========================================
        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const logoutBtnMobile = document.getElementById('logout-btn-mobile');
        if (logoutBtnMobile) logoutBtnMobile.addEventListener('click', () => signOut(auth));

        // Écouteur d'état de connexion
        // Seuls les emails de la whitelist (définie dans env.js) ont accès
        onAuthStateChanged(auth, (user) => {
            if (user) {
                const emailAutorise = ENV.ADMIN_EMAILS.includes(user.email);
                if (!emailAutorise) {
                    // Email non autorisé : on déconnecte immédiatement
                    signOut(auth);
                    loginError.textContent = `Accès refusé. Ce compte (${user.email}) n'est pas autorisé.`;
                    loginError.style.display = 'block';
                    return;
                }
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden'); document.getElementById('admin-header').classList.remove('hidden'); document.getElementById('bottom-nav-admin').classList.remove('hidden');
                loadProducts();
            } else {
                loginScreen.classList.remove('hidden');
                dashboard.classList.add('hidden'); document.getElementById('admin-header').classList.add('hidden'); document.getElementById('bottom-nav-admin').classList.add('hidden');
            }
        });

        // Gestion de la soumission du formulaire de login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const btn = loginForm.querySelector('button');
                btn.textContent = "Connexion...";
                btn.disabled = true;

                await signInWithEmailAndPassword(auth, email, password);
                loginError.style.display = 'none';

                btn.textContent = "Se connecter";
                btn.disabled = false;
            } catch (error) {
                loginError.textContent = "Erreur de connexion : Vérifiez vos identifiants.";
                loginError.style.display = 'block';
                const btn = loginForm.querySelector('button');
                btn.textContent = "Se connecter";
                btn.disabled = false;
            }
        });

        // Déconnexion
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // ==========================================
        // 2b. CONNEXION GOOGLE
        // ==========================================
        const googleBtn = document.getElementById('google-login-btn');
        const googleProvider = new GoogleAuthProvider();

        googleBtn.addEventListener('click', async () => {
            googleBtn.textContent = 'Connexion...';
            googleBtn.disabled = true;
            try {
                await signInWithPopup(auth, googleProvider);
                loginError.style.display = 'none';
            } catch (error) {
                loginError.textContent = 'Erreur Google : ' + (error.message || 'Réessayez.');
                loginError.style.display = 'block';
            } finally {
                googleBtn.disabled = false;
                googleBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l5.9-5.9C34.5 3.5 29.6 1.5 24 1.5 14.8 1.5 7 7.3 3.7 15.2l6.9 5.4C12.3 14.2 17.6 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.4 5.8c4.3-4 6.8-9.9 6.8-17z"/>
                        <path fill="#FBBC05" d="M10.6 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-6.9-5.4A22.5 22.5 0 0 0 1.5 24c0 3.6.9 7 2.4 10l6.7-5.4z"/>
                        <path fill="#34A853" d="M24 46.5c5.5 0 10.2-1.8 13.6-4.9l-7.4-5.8c-1.8 1.2-4.1 2-6.2 2-6.4 0-11.7-4.7-13.4-11l-6.7 5.4C7 40.7 14.8 46.5 24 46.5z"/>
                    </svg>
                    Se connecter avec Google`;
            }
        });

        // ==========================================
        // 2c. CATEGORY PILLS
        // ==========================================
        const categoryPills = document.querySelectorAll('.cat-pill');
        const prodCatInput = document.getElementById('prod-cat');

        categoryPills.forEach(pill => {
            pill.addEventListener('click', () => {
                // Deselect all, select clicked
                categoryPills.forEach(p => p.classList.remove('selected'));
                pill.classList.add('selected');
                prodCatInput.value = pill.dataset.value;
            });
        });

        // ==========================================
        // 3. CLOUDINARY UPLOAD WIDGET
        // ==========================================
        const uploadWidgetBtn = document.getElementById('upload-widget-btn');
        const imagePreview = document.getElementById('image-preview');
        const prodImgUrlInput = document.getElementById('prod-img-url');
        const prodCloudIdInput = document.getElementById('prod-cloud-id');

        // Création de l'instance du widget Cloudinary
        let cloudinaryWidget = cloudinary.createUploadWidget({
            cloudName: CLOUDINARY_CLOUD_NAME,
            uploadPreset: CLOUDINARY_UPLOAD_PRESET,
            sources: ['local', 'url', 'camera'],
            multiple: false,
            theme: "minimal",
            styles: {
                palette: {
                    window: "#1E1E1E",
                    windowBorder: "#333333",
                    tabIcon: "#5E17EB",
                    menuIcons: "#A0A0A0",
                    textDark: "#F5F5F5",
                    textLight: "#FFFFFF",
                    link: "#FF0D8D",
                    action: "#5E17EB",
                    inactiveTabIcon: "#A0A0A0",
                    error: "#FF3B30",
                    inProgress: "#5E17EB",
                    complete: "#34C759",
                    sourceBg: "#121212"
                }
            }
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                const url = result.info.secure_url;
                const publicId = result.info.public_id;

                // Sauvegarde des données dans les champs cachés
                prodImgUrlInput.value = url;
                prodCloudIdInput.value = publicId;

                // Affichage de l'aperçu
                imagePreview.innerHTML = `<img src="${url}" alt="Aperçu du produit">`;

                // Feedback visuel sur le bouton
                uploadWidgetBtn.textContent = "Image Ajoutée ✓";
                uploadWidgetBtn.style.borderColor = "var(--success)";
                uploadWidgetBtn.style.color = "var(--success)";
            }
        });

        // Ouverture du widget au clic
        uploadWidgetBtn.addEventListener('click', () => {
            cloudinaryWidget.open();
        });

        // ==========================================
        // 4. AJOUT / MODIFICATION DE PRODUIT
        // ==========================================
        const addProductForm = document.getElementById('add-product-form');
        const formPanelTitle = document.getElementById('form-panel-title');
        const formSubmitBtn = document.getElementById('form-submit-btn');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        let editingId = null; // null = mode ajout, sinon ID du produit en cours d'édition

        // Fonction utilitaire : réinitialise le formulaire et revient en mode ajout
        function resetForm() {
            editingId = null;
            addProductForm.reset();
            categoryPills.forEach(p => p.classList.remove('selected'));
            imagePreview.innerHTML = `<span>Aucune image</span>`;
            prodImgUrlInput.value = '';
            prodCloudIdInput.value = '';
            uploadWidgetBtn.textContent = 'Upload Image (Cloudinary)';
            uploadWidgetBtn.style.borderColor = 'var(--primary)';
            uploadWidgetBtn.style.color = 'var(--text-light)';
            formPanelTitle.textContent = 'Ajouter un Produit';
            formSubmitBtn.textContent = 'Ajouter le Produit';
            if (cancelEditBtn) cancelEditBtn.classList.add('hidden');
            window.closeDrawer();
        }

        window.cancelEdit = resetForm;

        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = formSubmitBtn;
            btn.disabled = true;
            btn.textContent = editingId ? 'Mise à jour...' : 'Ajout en cours...';

            try {
                const nom = document.getElementById('prod-name').value;
                const categorie = document.getElementById('prod-cat').value;
                const description = document.getElementById('prod-desc').value;
                const prix = parseFloat(document.getElementById('prod-price').value);
                const badge = document.getElementById('prod-badge').value;
                const stock = parseInt(document.getElementById('prod-stock').value) || 0;
                const imageUrl = document.getElementById('prod-img-url').value;
                const cloudinaryId = document.getElementById('prod-cloud-id').value;

                if (!imageUrl) {
                    alert('Veuillez uploader une image pour le produit via Cloudinary.');
                    btn.disabled = false;
                    btn.textContent = editingId ? 'Mettre à jour' : 'Ajouter le Produit';
                    return;
                }

                if (editingId) {
                    // ── MODE ÉDITION : updateDoc ──
                    await updateDoc(doc(db, 'produits', editingId), {
                        nom,
                        categorie,
                        description,
                        prix,
                        badge: badge || null,
                        promo: badge === 'PROMO',
                        imageUrl,
                        cloudinaryId,
                        stock
                    });
                } else {
                    // ── MODE AJOUT : addDoc ──
                    await addDoc(produitsCol, {
                        nom,
                        categorie,
                        description,
                        prix,
                        ancienPrix: null,
                        promo: badge === 'PROMO',
                        badge: badge || null,
                        imageUrl,
                        cloudinaryId,
                        stock,
                        createdAt: serverTimestamp()
                    });
                }

                resetForm();

            } catch (error) {
                console.error('Erreur lors de la sauvegarde:', error);
                alert('Erreur lors de la sauvegarde du produit.');
            } finally {
                btn.disabled = false;
                btn.textContent = editingId ? 'Mettre à jour' : 'Ajouter le Produit';
            }
        });

        // ==========================================
        // 5. LECTURE & GESTION DES PRODUITS (Temps Réel)
        // ==========================================
        const productListEl = document.getElementById('product-list');
        let unsubscribeSnapshot = null;
        let allProducts = []; // cache local de tous les produits
        let adminCatFilter = ''; // catégorie active dans les onglets

        function loadProducts() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            unsubscribeSnapshot = onSnapshot(produitsCol, (snapshot) => {
                allProducts = [];
                snapshot.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                // Tri par date de création (les plus récents en premier)
                allProducts.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                renderAdminList();
            }, (error) => {
                console.error('Erreur lecture produits:', error);
            });
        }

        function renderAdminList() {
            const search = (document.getElementById('admin-search')?.value || '').toLowerCase();
            let filtered = allProducts.filter(p => {
                const isRuptureTab = adminCatFilter === '__rupture__';
                const catOk = !adminCatFilter || isRuptureTab || p.categorie === adminCatFilter;
                const rupOk = !isRuptureTab || (p.stock ?? 0) <= 0;
                const searchOk = !search || (p.nom || '').toLowerCase().includes(search);
                return catOk && rupOk && searchOk;
            });

            productListEl.innerHTML = '';

            // Mise à jour des stats
            document.getElementById('stat-total').textContent = allProducts.length;
            const ruptureCount = allProducts.filter(p => (p.stock ?? 0) <= 0).length;
            document.getElementById('stat-rupture').textContent = ruptureCount;
            document.getElementById('stat-promo').textContent = allProducts.filter(p => p.promo).length;

            // Mise à jour de l'alerte rupture
            const alertBanner = document.getElementById('stock-alert-banner');
            const alertCount = document.getElementById('stock-alert-count');
            const ruptureTab = document.getElementById('tab-rupture');
            if (ruptureCount > 0) {
                alertBanner.classList.add('visible');
                alertCount.textContent = ruptureCount;
                ruptureTab.textContent = `🔴 Rupture (${ruptureCount})`;
            } else {
                alertBanner.classList.remove('visible');
                ruptureTab.textContent = '🔴 Rupture';
            }

            if (filtered.length === 0) {
                productListEl.innerHTML = '<div class="empty-admin">📦 Aucun produit trouvé.</div>';
                return;
            }
            filtered.forEach(p => renderProductRow(p.id, p));
        }

        function getStockBadge(stock) {
            const s = stock ?? 0;
            if (s <= 0) return `<span class="stock-badge rupture">🔴 Rupture</span>`;
            if (s <= 5) return `<span class="stock-badge low">🟡 ${s} restant${s > 1 ? 's' : ''}</span>`;
            return `<span class="stock-badge ok">🟢 ${s} en stock</span>`;
        }

        function renderProductRow(id, data) {
            const row = document.createElement('div');
            row.className = 'prod-row';
            row.dataset.id = id;

            let badgeHtml = '';
            if (data.badge === 'PROMO') badgeHtml = '<span class="row-badge promo">PROMO</span>';
            else if (data.badge === 'NEW') badgeHtml = '<span class="row-badge new">NEW</span>';

            const price = data.promo && data.ancienPrix
                ? `<span style="text-decoration:line-through;color:var(--text-muted);font-size:0.75rem;">${data.ancienPrix.toLocaleString('fr-FR')}</span> ${data.prix.toLocaleString('fr-FR')} F CFA`
                : `${data.prix.toLocaleString('fr-FR')} F CFA`;

            const stock = data.stock ?? 0;

            row.innerHTML = `
                <img class="prod-row-thumb" src="${data.imageUrl || ''}" alt="${data.nom}" loading="lazy">
                <div class="prod-row-info">
                    <div class="prod-row-name">${data.nom}</div>
                    <div class="prod-row-meta">
                        <span>${data.categorie || '—'}</span>
                        ${badgeHtml}
                        ${getStockBadge(stock)}
                    </div>
                </div>
                <div class="prod-row-price">${price}</div>
                <div class="stock-stepper" title="Ajuster le stock">
                    <button class="minus" onclick="updateStock('${id}', ${stock}, -1)" title="Retirer 1">−</button>
                    <span class="stock-val">${stock}</span>
                    <button class="plus"  onclick="updateStock('${id}', ${stock}, +1)" title="Ajouter 1">+</button>
                </div>
                <div class="prod-row-actions">
                    <label class="toggle-switch" title="Promo">
                        <input type="checkbox" id="toggle-${id}" ${data.promo ? 'checked' : ''}
                            onchange="togglePromo('${id}', this.checked, ${data.prix})">
                        <span class="slider"></span>
                    </label>
                    <button class="btn btn-outline" onclick="editProduit('${id}')" style="background:rgba(94,23,235,0.15);">✏️</button>
                    <button class="btn btn-danger" onclick="supprimerProduit('${id}')">🗑️</button>
                </div>
            `;
            productListEl.appendChild(row);
        }

        // Expose au window pour les onglets et la recherche
        window.setAdminTab = (el) => {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            adminCatFilter = el.dataset.cat;
            renderAdminList();
        };
        window.filterAdminList = renderAdminList;

        // Filtre rapide : aller sur l'onglet rupture
        window.filterByRupture = () => {
            const ruptureTab = document.getElementById('tab-rupture');
            if (ruptureTab) window.setAdminTab(ruptureTab);
            ruptureTab?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };

        // Ajustement rapide du stock (+1 / -1) sans ouvrir le formulaire
        window.updateStock = async (id, currentStock, delta) => {
            const newStock = Math.max(0, (currentStock ?? 0) + delta);
            try {
                await updateDoc(doc(db, 'produits', id), { stock: newStock });
                // Mise à jour optimiste de l'affichage local
                const prod = allProducts.find(p => p.id === id);
                if (prod) prod.stock = newStock;
                renderAdminList();
            } catch (err) {
                console.error('Erreur mise à jour stock:', err);
                alert('Erreur lors de la mise à jour du stock.');
            }
        };

        // Drawer Formulaire
        window.openDrawer = () => {
            document.getElementById('drawer-overlay').classList.add('active');
            document.getElementById('drawer-panel').classList.add('open');
        };
        window.closeDrawer = () => {
            document.getElementById('drawer-overlay').classList.remove('active');
            document.getElementById('drawer-panel').classList.remove('open');
            editingId = null;
            document.getElementById('add-product-form').reset();
            formPanelTitle.textContent = 'Ajouter un Produit';
            formSubmitBtn.textContent = 'Ajouter le Produit';
            document.getElementById('image-preview').innerHTML = '<span>Aucune image</span>';
            document.getElementById('prod-img-url').value = '';
            document.getElementById('prod-cloud-id').value = '';
            uploadWidgetBtn.textContent = 'Upload Image (Cloudinary)';
            uploadWidgetBtn.style.borderColor = 'var(--primary)';
            uploadWidgetBtn.style.color = 'var(--text-light)';
            categoryPills.forEach(p => p.classList.remove('selected'));
        };

        // ==========================================
        // 6. ACTIONS SUR LES PRODUITS (Exposées à window)
        // ==========================================

        // Suppression (Firestore uniquement, pas Cloudinary selon la consigne)
        window.supprimerProduit = async (id) => {
            if (confirm("Voulez-vous vraiment supprimer ce produit de la base de données ?")) {
                try {
                    await deleteDoc(doc(db, "produits", id));
                } catch (error) {
                    console.error("Erreur suppression:", error);
                    alert("Erreur lors de la suppression.");
                }
            }
        };

        // Modification du prix standard
        window.modifierPrix = async (id, prixActuel) => {
            const nouveauPrixStr = prompt("Entrez le nouveau prix en € :", prixActuel);
            if (nouveauPrixStr === null) return; // Annulation

            const nouveauPrix = parseFloat(nouveauPrixStr);
            if (isNaN(nouveauPrix) || nouveauPrix < 0) {
                alert("Prix invalide.");
                return;
            }

            try {
                // Si on modifie le prix, on update simplement 'prix'
                await updateDoc(doc(db, "produits", id), {
                    prix: nouveauPrix
                });
            } catch (error) {
                console.error("Erreur modif prix:", error);
                alert("Erreur lors de la modification du prix.");
            }
        };

        // Gestion du toggle de promotion
        window.togglePromo = async (id, isPromo, prixActuel) => {
            const docRef = doc(db, "produits", id);
            const toggleElement = document.getElementById(`toggle-${id}`);

            try {
                if (isPromo) {
                    const prixPromoStr = prompt(`Le produit passe en promo.\nPrix actuel: ${prixActuel.toLocaleString('fr-FR')} F CFA.\n\nEntrez le nouveau PRIX RÉDUIT en F CFA :`);

                    if (prixPromoStr === null) {
                        toggleElement.checked = false;
                        return;
                    }

                    const prixPromo = parseFloat(prixPromoStr);
                    if (isNaN(prixPromo) || prixPromo >= prixActuel || prixPromo < 0) {
                        alert("Le prix promo doit être un nombre valide et strictement inférieur au prix actuel.");
                        toggleElement.checked = false;
                        return;
                    }

                    await updateDoc(docRef, {
                        promo: true,
                        ancienPrix: prixActuel,
                        prix: prixPromo,
                        badge: 'PROMO'
                    });

                } else {
                    const snap = await getDoc(docRef);
                    if (snap.exists()) {
                        const data = snap.data();
                        const prixInitial = data.ancienPrix || data.prix;
                        await updateDoc(docRef, {
                            promo: false,
                            ancienPrix: null,
                            prix: prixInitial,
                            badge: null
                        });
                    }
                }
            } catch (error) {
                console.error("Erreur toggle promo:", error);
                alert("Erreur lors de la modification de la promotion.");
                toggleElement.checked = !isPromo;
            }
        };

        // ── ÉDITION D'UN PRODUIT ──
        window.editProduit = async (id) => {
            try {
                const snap = await getDoc(doc(db, 'produits', id));
                if (!snap.exists()) { alert('Produit introuvable.'); return; }
                const d = snap.data();

                // Passer en mode édition
                editingId = id;
                formPanelTitle.textContent = '✏️ Modifier le Produit';
                formSubmitBtn.textContent = 'Mettre à jour';
                if (cancelEditBtn) cancelEditBtn.classList.remove('hidden');

                // Pré-remplir les champs
                document.getElementById('prod-name').value = d.nom || '';
                document.getElementById('prod-desc').value = d.description || '';
                document.getElementById('prod-price').value = d.prix || '';
                document.getElementById('prod-stock').value = d.stock || 0;
                document.getElementById('prod-badge').value = d.badge || '';

                // Catégorie : sélectionner le bon pill
                categoryPills.forEach(p => {
                    p.classList.toggle('selected', p.dataset.value === d.categorie);
                });
                document.getElementById('prod-cat').value = d.categorie || '';

                // Image
                if (d.imageUrl) {
                    imagePreview.innerHTML = `<img src="${d.imageUrl}" alt="Aperçu">`;
                    prodImgUrlInput.value = d.imageUrl;
                    prodCloudIdInput.value = d.cloudinaryId || '';
                    uploadWidgetBtn.textContent = 'Changer l\'image';
                    uploadWidgetBtn.style.borderColor = 'var(--success)';
                    uploadWidgetBtn.style.color = 'var(--success)';
                }

                window.openDrawer();

            } catch (error) {
                console.error('Erreur chargement produit:', error);
                alert('Impossible de charger ce produit.');
            }
        };
    </script>
</body>

</html>
